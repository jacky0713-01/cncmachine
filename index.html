<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Capacity Roadmap Metals, Graphite, W/Mo/Ta, Silicon</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --highlight: #34d399;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.01em;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background-color: #0284c7;
      color: #fff;
      border: none;
    }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid #ef4444;
    }
    .btn-danger:hover { background-color: #dc2626; color: #fff; }

    .table-container {
      overflow-x: auto;
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .material-header {
      font-weight: 800;
      color: #38bdf8;
      background-color: rgba(15, 23, 42, 0.5);
    }

    .editable {
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .editable:hover {
      background-color: rgba(56, 189, 248, 0.15) !important;
      outline: 1px dashed var(--accent);
    }

    .highlight-val {
      color: #38bdf8;
      font-weight: 700;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .action-btn:hover { color: var(--danger); }
  </style>
</head>
<body>

  <header>
    <h1>2026 Capacity Roadmap Metals, Graphite, W/Mo/Ta, Silicon</h1>
    <div class="subtitle">💡 雙擊（Double Click）表格內的任何數字或名稱即可直接編輯內容。修改後會自動儲存。</div>
  </header>

  <div class="toolbar">
    <button id="add-row-btn" class="btn btn-primary">➕ 新增資料列</button>
    <button id="export-json-btn" class="btn">💾 備份 JSON</button>
    <button id="import-btn" class="btn">📤 匯入 JSON 備份</button>
    <button id="reset-btn" class="btn btn-danger">🔄 重置預設資料</button>
    <input type="file" id="import-file-input" accept=".json" style="display: none;">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 15%;">Material</th>
          <th style="width: 25%;">Process / Machine</th>
          <th style="width: 15%;">2025</th>
          <th style="width: 20%;">2026</th>
          <th style="width: 20%;">2026 2H</th>
          <th style="width: 5%;">操作</th>
        </tr>
      </thead>
      <tbody id="table-body">
      </tbody>
    </table>
  </div>

  <script>
    // 預設資料 (對應圖中的所有表格資料)
    const initialData = [
      // Metal: AL/SST
      { material: "Metal: AL/SST", process: "3 Axis Milling", y2025: "38", y2026: "38", y2026_2h: "38" },
      { material: "Metal: AL/SST", process: "Auto 3 Axis Milling", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Turning-Milling", y2025: "10", y2026: "10", y2026_2h: "10" },
      { material: "Metal: AL/SST", process: "Grinding", y2025: "7", y2026: "7", y2026_2h: "7" },
      { material: "Metal: AL/SST", process: "Lapping", y2025: "6", y2026: "6", y2026_2h: "6" },
      { material: "Metal: AL/SST", process: "Lathe", y2025: "2", y2026: "2", y2026_2h: "2" },
      { material: "Metal: AL/SST", process: "Multi Axis Milling", y2025: "22", y2026: "22", y2026_2h: "25 (2026 1H +3)" },
      { material: "Metal: AL/SST", process: "SAWING", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Water Jet Cutter", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "EP(Non-Al)", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Auto Anodizing", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "ENP(Al)", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "ENP(Non-Al)", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "TIG Welding", y2025: "3", y2026: "3", y2026_2h: "3" },
      { material: "Metal: AL/SST", process: "E Beam Welding", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Auto Clean Line", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Clean Line", y2025: "1", y2026: "1", y2026_2h: "" },
      { material: "Metal: AL/SST", process: "Auto ENP(Cylinder)", y2025: "", y2026: "1 (2025+1)", y2026_2h: "1" },
      { material: "Metal: AL/SST", process: "Vacuum Brazing", y2025: "", y2026: "1 (2025+1)", y2026_2h: "1" },

      // Graphite
      { material: "Graphite", process: "3 Axis Milling", y2025: "21", y2026: "21", y2026_2h: "21" },
      { material: "Graphite", process: "NJ: 3 Axis Milling", y2025: "10", y2026: "10", y2026_2h: "10" },
      { material: "Graphite", process: "Turning-Milling", y2025: "2", y2026: "2", y2026_2h: "2" },
      { material: "Graphite", process: "Grinding", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Graphite", process: "Lathe", y2025: "5", y2026: "5", y2026_2h: "5" },
      { material: "Graphite", process: "Thermo Molding", y2025: "1", y2026: "1", y2026_2h: "3 (2026 1H +2)" },
      { material: "Graphite", process: "SAWING", y2025: "3", y2026: "3", y2026_2h: "3" },
      { material: "Graphite", process: "Wire Cut", y2025: "3", y2026: "3", y2026_2h: "3" },
      { material: "Graphite", process: "Auto Clean Line", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "Graphite", process: "Lathe", y2025: "", y2026: "", y2026_2h: "1 (2026 1H +1)" },
      { material: "Graphite", process: "Turning-Milling", y2025: "", y2026: "", y2026_2h: "1 (2026 1H +1)" },

      // W/Mo/Ta
      { material: "W/Mo/Ta", process: "3 Axis Milling", y2025: "45", y2026: "47 (2025+2)", y2026_2h: "47" },
      { material: "W/Mo/Ta", process: "JP: 3 Axis Milling", y2025: "", y2026: "", y2026_2h: "7 (2026 1H +7)" },
      { material: "W/Mo/Ta", process: "Auto 3 Axis Milling", y2025: "12", y2026: "12", y2026_2h: "16 (2026 1H +4)" },
      { material: "W/Mo/Ta", process: "Auto Lathe", y2025: "16", y2026: "16", y2026_2h: "16" },
      { material: "W/Mo/Ta", process: "Turning-Milling", y2025: "4", y2026: "4", y2026_2h: "4" },
      { material: "W/Mo/Ta", process: "EDM", y2025: "7", y2026: "7", y2026_2h: "7" },
      { material: "W/Mo/Ta", process: "JP: Grinding", y2025: "", y2026: "", y2026_2h: "1 (2026 1H +1)" },
      { material: "W/Mo/Ta", process: "Grinding", y2025: "7", y2026: "8 (2025+1)", y2026_2h: "8" },
      { material: "W/Mo/Ta", process: "Lathe", y2025: "16", y2026: "16", y2026_2h: "17 (2026 1H +1)" },
      { material: "W/Mo/Ta", process: "JP: Wire Cut", y2025: "", y2026: "", y2026_2h: "1 (2026 1H +1)" },
      { material: "W/Mo/Ta", process: "Wire Cut", y2025: "48", y2026: "48", y2026_2h: "48" },
      { material: "W/Mo/Ta", process: "Annealing", y2025: "1", y2026: "1", y2026_2h: "1" },
      { material: "W/Mo/Ta", process: "Laser Welding", y2025: "2", y2026: "3 (2025+1)", y2026_2h: "3" },
      { material: "W/Mo/Ta", process: "Auto Clean Line", y2025: "2", y2026: "2", y2026_2h: "2" },

      // Silicon
      { material: "Silicon", process: "3 Axis Milling", y2025: "22", y2026: "22", y2026_2h: "22" }
    ];

    let roadmapData = JSON.parse(localStorage.getItem('roadmap_data')) || initialData;

    const tbody = document.getElementById('table-body');

    function renderTable() {
      tbody.innerHTML = '';
      let currentMaterial = '';

      roadmapData.forEach((row, index) => {
        const tr = document.createElement('tr');

        // Material 合併或顯示邏輯
        let materialCellHtml = '';
        if (row.material !== currentMaterial) {
          currentMaterial = row.material;
          materialCellHtml = `<td class="material-header editable" ondblclick="editCell(${index}, 'material')">${row.material}</td>`;
        } else {
          materialCellHtml = `<td class="material-header editable" ondblclick="editCell(${index}, 'material')" style="color: transparent;">${row.material}</td>`;
        }

        tr.innerHTML = `
          ${materialCellHtml}
          <td class="editable" ondblclick="editCell(${index}, 'process')">${row.process || '-'}</td>
          <td class="editable" ondblclick="editCell(${index}, 'y2025')">${row.y2025 || '-'}</td>
          <td class="editable" ondblclick="editCell(${index}, 'y2026')">${row.y2026 || '-'}</td>
          <td class="editable highlight-val" ondblclick="editCell(${index}, 'y2026_2h')">${row.y2026_2h || '-'}</td>
          <td style="text-align: center;">
            <button class="action-btn" onclick="deleteRow(${index})" title="刪除此行">🗑️</button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function editCell(index, key) {
      const fieldMap = {
        material: 'Material (材料類別)',
        process: 'Process / Machine (機台/工序)',
        y2025: '2025 數據',
        y2026: '2026 數據',
        y2026_2h: '2026 2H 數據'
      };

      const currentVal = roadmapData[index][key] || '';
      const newVal = prompt(`修改 ${fieldMap[key]}：`, currentVal);

      if (newVal !== null) {
        roadmapData[index][key] = newVal.trim();
        saveAndRender();
      }
    }

    function deleteRow(index) {
      if (confirm(`確定要刪除「${roadmapData[index].process}」這一列嗎？`)) {
        roadmapData.splice(index, 1);
        saveAndRender();
      }
    }

    document.getElementById('add-row-btn').onclick = () => {
      const material = prompt("請輸入 Material 類別 (例如 Metal: AL/SST, Graphite 等)：", "Metal: AL/SST");
      if (!material) return;
      const process = prompt("請輸入 Process / Machine 名稱：", "New Machine");
      if (!process) return;

      roadmapData.push({
        material: material.trim(),
        process: process.trim(),
        y2025: "0",
        y2026: "0",
        y2026_2h: "0"
      });

      saveAndRender();
    };

    function saveAndRender() {
      localStorage.setItem('roadmap_data', JSON.stringify(roadmapData));
      renderTable();
    }

    // 匯出 JSON
    document.getElementById('export-json-btn').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(roadmapData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `Capacity_Roadmap_Backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    // 匯入 JSON
    const importBtn = document.getElementById('import-btn');
    const importFileInput = document.getElementById('import-file-input');

    importBtn.onclick = () => importFileInput.click();

    importFileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            roadmapData = imported;
            saveAndRender();
            alert("資料成功匯入！");
          } else {
            alert("格式不符！請上傳正確的 Roadmap JSON 檔案。");
          }
        } catch (err) {
          alert("無法讀取此 JSON 檔案！");
        }
        importFileInput.value = '';
      };
      reader.readAsText(file);
    };

    // 重置資料
    document.getElementById('reset-btn').onclick = () => {
      if (confirm("警告：這將會清除您所有的修改，恢復成圖片的預設數值！確定要重置嗎？")) {
        roadmapData = [...initialData];
        saveAndRender();
      }
    };

    // 初始化渲染
    renderTable();
  </script>
</body>
</html>
