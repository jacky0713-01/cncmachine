<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Capacity Roadmap & Machine Analytics</title>
  <!-- 引入 html2canvas 程式庫以支援一鍵截圖匯出圖片 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
    }

    .auth-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .auth-status {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 分頁標籤列 (Tabs) */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }
    .btn-success { background-color: #10b981; color: #fff; border: none; }
    .btn-success:hover { background-color: #059669; color: #fff; }
    .btn-danger { background-color: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    .btn-danger:hover { background-color: #dc2626; color: #fff; }

    /* 視圖內容區塊 */
    .tab-content {
      display: none;
      flex: 1;
      overflow: auto;
      background-color: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .tab-content.active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .material-header {
      font-weight: 800;
      color: var(--accent);
      background-color: rgba(15, 23, 42, 0.5);
    }

    /* 分析頁面面板卡牌 */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .stat-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-card-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-card-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--success);
    }

    .delta-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .delta-plus { background: rgba(52, 211, 153, 0.15); color: var(--success); border: 1px solid var(--success); }
    .delta-new { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid var(--accent); }

    body.read-only .editable { cursor: default; }
    body:not(.read-only) .editable { cursor: pointer; }
    body:not(.read-only) .editable:hover {
      background-color: rgba(56, 189, 248, 0.15) !important;
      outline: 1px dashed var(--accent);
    }

    .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; }
    body:not(.read-only) .action-btn:hover { color: var(--danger); }
    body.read-only .action-btn { opacity: 0.3; cursor: not-allowed; }
  </style>
</head>
<body class="read-only">

  <div class="app-container">
    <header>
      <div class="brand-title">
        <span class="badge-pro">PRO ENTERPRISE</span>
        <h1>2026 Capacity Roadmap & Machine Analytics</h1>
      </div>
      <div class="auth-box">
        <span id="auth-status" class="auth-status">狀態：唯讀模式</span>
        <button id="auth-btn" class="btn btn-primary">管理員登入</button>
      </div>
    </header>

    <!-- 主分頁導覽 -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('roadmap-tab')">📊 Capacity Roadmap 圖鑑表</button>
      <button class="tab-btn" onclick="switchTab('analytics-tab')">📈 機台增減動態分析</button>
    </div>

    <!-- 頁面一：Roadmap 圖鑑表 -->
    <div id="roadmap-tab" class="tab-content active">
      <div class="toolbar" style="padding: 12px 16px 0 16px;">
        <button id="add-row-btn" class="btn btn-primary">➕ 新增資料列</button>
        <button id="export-roadmap-img-btn" class="btn btn-success">📸 匯出圖鑑表圖片 (PNG)</button>
        <button id="export-json-btn" class="btn">💾 備份 JSON</button>
        <button id="import-btn" class="btn">📤 匯入 JSON 備份</button>
        <button id="reset-btn" class="btn btn-danger">🔄 重置預設資料</button>
        <input type="file" id="import-file-input" accept=".json" style="display: none;">
      </div>
      <div id="roadmap-export-area" style="padding: 12px 16px;">
        <table>
          <thead>
            <tr>
              <th style="width: 15%;">Material</th>
              <th style="width: 25%;">Process / Machine</th>
              <th style="width: 15%;">2025</th>
              <th style="width: 20%;">2026</th>
              <th style="width: 20%;">2026 2H</th>
              <th style="width: 5%; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="table-body">
          </tbody>
        </table>
      </div>
    </div>

    <!-- 頁面二：機台增減分析 (Analytics) -->
    <div id="analytics-tab" class="tab-content">
      <div class="toolbar" style="padding: 12px 20px 0 20px; justify-content: flex-end;">
        <button id="export-image-btn" class="btn btn-success">📸 匯出分析圖表圖片 (PNG)</button>
      </div>
      <div id="analytics-export-area">
        <div class="analytics-grid">
          <div class="stat-card">
            <div class="stat-card-title">2025 -> 2026 擴產項目</div>
            <div id="stat-2026-exp" class="stat-card-value">0 項</div>
          </div>
          <div class="stat-card">
            <div class="stat-card-title">2026 2H 新增擴產項目</div>
            <div id="stat-20262h-exp" class="stat-card-value" style="color: #38bdf8;">0 項</div>
          </div>
        </div>
        <div style="padding: 0 20px 20px 20px;">
          <h3 style="color: var(--accent); margin-top: 0;">🔍 機台擴產與異動明細分析清單</h3>
          <table>
            <thead>
              <tr>
                <th>Material</th>
                <th>Process / Machine</th>
                <th>2025 基準</th>
                <th>2026 變更內容</th>
                <th>2026 2H 變更內容</th>
                <th>異動狀態分類</th>
              </tr>
            </thead>
            <tbody id="analytics-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
   // 📸 1. 圖鑑表頁面：高畫質一鍵匯出圖片 (PNG)
document.getElementById('export-roadmap-img-btn').onclick = () => {
  const exportArea = document.getElementById('roadmap-export-area');
  const exportBtn = document.getElementById('export-roadmap-img-btn');

  exportBtn.innerText = "⏳ 高畫質圖片生成中...";
  exportBtn.disabled = true;

  html2canvas(exportArea, {
    backgroundColor: '#1e293b',
    scale: 3, // 升級為 3 倍超高解析度（防文字模糊）
    useCORS: true, // 支援跨域資源
    logging: false,
    windowWidth: exportArea.scrollWidth,
    windowHeight: exportArea.scrollHeight,
    onclone: (clonedDoc) => {
      // 確保複製出的備份畫布能夠展開完整表格，不受滾動條限制
      const clonedArea = clonedDoc.getElementById('roadmap-export-area');
      clonedArea.style.maxHeight = 'none';
      clonedArea.style.overflow = 'visible';
    }
  }).then(canvas => {
    const image = canvas.toDataURL("image/png", 1.0); // 以 100% 最高畫質匯出
    const link = document.createElement('a');
    link.href = image;
    link.download = `Capacity_Roadmap_HD_${new Date().toISOString().slice(0,10)}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    exportBtn.innerText = "📸 匯出圖鑑表圖片 (PNG)";
    exportBtn.disabled = false;
  }).catch(err => {
    alert("匯出圖片失敗：" + err);
    exportBtn.innerText = "📸 匯出圖鑑表圖片 (PNG)";
    exportBtn.disabled = false;
  });
};

// 📸 2. 機台增減分析頁面：高畫質一鍵匯出圖片 (PNG)
document.getElementById('export-image-btn').onclick = () => {
  const exportArea = document.getElementById('analytics-export-area');
  const exportBtn = document.getElementById('export-image-btn');

  exportBtn.innerText = "⏳ 高畫質圖片生成中...";
  exportBtn.disabled = true;

  html2canvas(exportArea, {
    backgroundColor: '#1e293b',
    scale: 3, // 升級為 3 倍超高解析度
    useCORS: true,
    logging: false,
    windowWidth: exportArea.scrollWidth,
    windowHeight: exportArea.scrollHeight,
    onclone: (clonedDoc) => {
      const clonedArea = clonedDoc.getElementById('analytics-export-area');
      clonedArea.style.maxHeight = 'none';
      clonedArea.style.overflow = 'visible';
    }
  }).then(canvas => {
    const image = canvas.toDataURL("image/png", 1.0);
    const link = document.createElement('a');
    link.href = image;
    link.download = `Capacity_Analytics_HD_${new Date().toISOString().slice(0,10)}.png`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    exportBtn.innerText = "📸 匯出分析圖表圖片 (PNG)";
    exportBtn.disabled = false;
  }).catch(err => {
    alert("匯出圖片失敗：" + err);
    exportBtn.innerText = "📸 匯出分析圖表圖片 (PNG)";
    exportBtn.disabled = false;
  });
};
